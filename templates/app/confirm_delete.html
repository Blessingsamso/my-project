{% extends 'base.html' %}
{% load static %}
{% block title %}Confirm Delete | Land for crypto{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg px-4 py-12">
  <div class="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
    <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full border border-red-200 bg-red-50 text-2xl text-red-600">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h3 class="font-display text-2xl font-bold text-slate-900">Delete {{ type }}?</h3>
    <p class="mt-2 text-slate-600">
      Permanently delete <strong>"{{ object.title }}"</strong>? This cannot be undone.
    </p>
    <form method="POST" class="mt-6 flex justify-center gap-3">
      {% csrf_token %}
      <a href="{% url 'app:seller_dashboard' %}" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>
      <button type="submit" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-bold text-white hover:bg-red-700">
        Yes, delete
      </button>
    </form>
  </div>
</div>
{% endblock %}
