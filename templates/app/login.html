{% extends 'base.html' %}
{% load static %}
{% block title %}Log In | Land for crypto{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-4 py-12">
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
    <div class="mb-6 text-center">
      <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full border border-emerald-200 bg-emerald-50 text-xl text-emerald-700">
        <i class="fa-solid fa-right-to-bracket"></i>
      </div>
      <h3 class="font-display text-2xl font-bold text-slate-900">Welcome back</h3>
      <p class="mt-1 text-sm text-slate-600">Log in to manage listings and offers.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="mb-1 block text-xs font-semibold uppercase text-slate-500">Username or email</label>
        {{ form.username }}
      </div>
      <div class="mb-5">
        <label class="mb-1 block text-xs font-semibold uppercase text-slate-500">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="mb-4 w-full rounded-xl bg-emerald-600 py-3 font-semibold text-white hover:bg-emerald-700">
        Log in
      </button>
      <p class="text-center text-sm text-slate-600">
        No account yet?
        <a href="{% url 'app:register' %}" class="font-semibold text-emerald-700 hover:underline">Register</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
